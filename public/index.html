<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <!-- Viewport meta so mobile devices scale the page correctly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Example fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&family=Open+Sans:wght@300;400;600;700;800&display=swap">
  
  <title>Ryder Cup Live Scoring</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- .page-wrapper for center alignment & margins -->
  <div class="page-wrapper">

    <!-- Scoreboard -->
    <div id="scoreboard">
      <h1 id="cupNameHeader">Ryder Cup Live Scoring</h1>
      <h2>
        <span id="team1NameLabel">Team 1</span>
        <span id="team1Score">0</span>
        vs
        <span id="team2Score">0</span>
        <span id="team2NameLabel">Team 2</span>
      </h2>
      <p id="pointsNeededDisplay"></p>
    </div>

    <!-- Winner Announcement -->
    <p id="winnerAnnouncement"></p>

    <!-- Day Tabs -->
    <div id="dayTabs"></div>

    <!-- Container for day views -->
    <div id="dayViewsContainer"></div>
  </div>

  <!-- Socket.IO + Client JS -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    let cupName = 'My Ryder Cup';
    let teams = [];
    let matches = [];
    let days = [];
    let pointsNeededToWin = 0;

    // We'll store the hole index for each match in this array
    let matchHoleIndices = [];

    // Active day can also be remembered in localStorage
    let activeDayNumber = parseInt(localStorage.getItem('activeDayNumber') || '1', 10);

    const socket = io();

    socket.on('connect', () => {
      console.log('Connected to server');
    });

    // Helper function to set the hole index for a particular match
    // and also save the entire array to localStorage.
    function setCurrentHoleIndex(matchIndex, newIndex) {
      matchHoleIndices[matchIndex] = newIndex;
      localStorage.setItem('matchHoleIndices', JSON.stringify(matchHoleIndices));
      renderDayViews(); 
    }

    // Listen for ntpWinnerUpdated from the server 
    // (when someone picks nearest to the pin winner)
    socket.on('ntpWinnerUpdated', (data) => {
      // data = { dayNumber, winner: 'A'|'B'|null }
      const dayObj = days.find((d) => d.dayNumber === data.dayNumber);
      if (dayObj) {
        dayObj.nearestToPinWinner = data.winner;
      }
      // Recompute scoreboard
      renderScoreboard();
      renderDayViews();
    });

    // initData => { cupName, teams, matches, days, pointsNeededToWin }
    socket.on('initData', (initData) => {
      cupName = initData.cupName || 'My Ryder Cup';
      teams = initData.teams;
      matches = initData.matches;
      days = initData.days;
      pointsNeededToWin = initData.pointsNeededToWin || 0;

      // Sort days
      days.sort((a, b) => a.dayNumber - b.dayNumber);

      // If our saved activeDayNumber is out of range, reset it
      if (activeDayNumber > (days[days.length - 1]?.dayNumber || 1)) {
        activeDayNumber = days[days.length - 1]?.dayNumber || 1;
      }

      // Set cup name in the header
      document.getElementById('cupNameHeader').innerText = cupName + ' Live Scoring';

      // Load or initialize matchHoleIndices from localStorage
      const stored = localStorage.getItem('matchHoleIndices');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          // Only apply if length matches number of matches
          if (Array.isArray(parsed) && parsed.length === matches.length) {
            matchHoleIndices = parsed;
          } else {
            matchHoleIndices = matches.map(() => 0);
          }
        } catch (err) {
          console.error('Error parsing stored matchHoleIndices:', err);
          matchHoleIndices = matches.map(() => 0);
        }
      } else {
        matchHoleIndices = matches.map(() => 0);
      }

      renderScoreboard();
      renderTabs();
      renderDayViews();
    });

    // When a match is updated (someone clicked A/H/B)
    socket.on('matchDataUpdated', (data) => {
      const { matchIndex, match } = data;
      matches[matchIndex] = match;
      renderScoreboard();
      renderDayViews();
    });

    // Render scoreboard (Team points, winner announcement, etc.)
    function renderScoreboard() {
      let team1Score = 0;
      let team2Score = 0;

      // Tally match points
      matches.forEach((m) => {
        if (m.winner === 'A') {
          team1Score += 1;
        } else if (m.winner === 'B') {
          team2Score += 1;
        } else if (m.winner === 'draw') {
          team1Score += 0.5;
          team2Score += 0.5;
        }
      });

      // Tally Nearest to the Pin half-points for each day
      days.forEach((day) => {
        if (day.nearestToPin && day.nearestToPinWinner) {
          // If day has NTP and a winner, +0.5 
          if (day.nearestToPinWinner === 'A') {
            team1Score += 0.5;
          } else if (day.nearestToPinWinner === 'B') {
            team2Score += 0.5;
          }
        }
      });

      document.getElementById('team1NameLabel').innerText = teams[0]?.name || 'Team 1';
      document.getElementById('team2NameLabel').innerText = teams[1]?.name || 'Team 2';
      document.getElementById('team1Score').innerText = team1Score.toString();
      document.getElementById('team2Score').innerText = team2Score.toString();

      document.getElementById('pointsNeededDisplay').innerText =
        `Points needed to win: ${pointsNeededToWin}`;

      const winnerAnnouncementEl = document.getElementById('winnerAnnouncement');
      if (team1Score >= pointsNeededToWin) {
        winnerAnnouncementEl.innerText =
          `${teams[0]?.name || 'Team 1'} wins the ${cupName}!`;
      } else if (team2Score >= pointsNeededToWin) {
        winnerAnnouncementEl.innerText =
          `${teams[1]?.name || 'Team 2'} wins the ${cupName}!`;
      } else {
        winnerAnnouncementEl.innerText = '';
      }
    }

    // Render day tabs (Day 1, Day 2, etc.)
    function renderTabs() {
      const dayTabsDiv = document.getElementById('dayTabs');
      dayTabsDiv.innerHTML = '';

      days.forEach((day) => {
        const btn = document.createElement('button');
        btn.innerText = `Day ${day.dayNumber}`;

        if (!isDayUnlocked(day.dayNumber)) {
          btn.disabled = true;
        }

        if (day.dayNumber === activeDayNumber) {
          btn.classList.add('active-tab');
        }

        btn.addEventListener('click', () => {
          activeDayNumber = day.dayNumber;
          localStorage.setItem('activeDayNumber', activeDayNumber);
          renderTabs();
          renderDayViews();
        });

        dayTabsDiv.appendChild(btn);
      });
    }

    function isDayUnlocked(dayNum) {
      if (dayNum === 1) return true;
      for (let d = 1; d < dayNum; d++) {
        if (!isDayConcluded(d)) return false;
      }
      return true;
    }

    function isDayConcluded(dayNum) {
      const dayMatches = matches.filter((m) => m.dayNumber === dayNum);
      if (dayMatches.length === 0) return false;
      return dayMatches.every((m) => m.winner !== null);
    }

    // Summarize how many matches Team A is up, Team B is up, or all square
    function computeDayUpDownSquare(dayNumber) {
      const dayMatches = matches.filter((m) => m.dayNumber === dayNumber && !m.winner);
      let aUp = 0, bUp = 0, allSquare = 0;

      dayMatches.forEach((m) => {
        if (m.holesUp > 0) {
          aUp++;
        } else if (m.holesUp < 0) {
          bUp++;
        } else {
          allSquare++;
        }
      });

      return {
        aUp,
        bUp,
        allSquare,
        totalIncomplete: dayMatches.length
      };
    }

    // Render day-by-day matches + NTP logic
    function renderDayViews() {
      const container = document.getElementById('dayViewsContainer');
      container.innerHTML = '';

      days.forEach((day) => {
        const dayView = document.createElement('div');
        dayView.classList.add('day-section');

        // Show or hide based on activeDayNumber
        dayView.style.display = (day.dayNumber === activeDayNumber) ? 'block' : 'none';

        // Title
        const dayHeader = document.createElement('h2');
        dayHeader.innerText = `Day ${day.dayNumber} - ${day.format}`;
        dayView.appendChild(dayHeader);

        // Show NTP UI if nearestToPin is true
        if (day.nearestToPin) {
          const ntpDiv = document.createElement('div');
          ntpDiv.style.margin = '10px 0';

          const ntpLabel = document.createElement('p');
          ntpLabel.innerText = 'Nearest to the Pin (0.5 pts):';
          ntpDiv.appendChild(ntpLabel);

          const btnA = document.createElement('button');
          btnA.innerText = (teams[0]?.name || 'Team A');
          btnA.onclick = () => {
            socket.emit('ntpUpdate', { dayNumber: day.dayNumber, winner: 'A' });
          };
          ntpDiv.appendChild(btnA);

          const btnB = document.createElement('button');
          btnB.innerText = (teams[1]?.name || 'Team B');
          btnB.onclick = () => {
            socket.emit('ntpUpdate', { dayNumber: day.dayNumber, winner: 'B' });
          };
          ntpDiv.appendChild(btnB);

          const btnNone = document.createElement('button');
          btnNone.innerText = 'None';
          btnNone.onclick = () => {
            socket.emit('ntpUpdate', { dayNumber: day.dayNumber, winner: null });
          };
          ntpDiv.appendChild(btnNone);

          const currentWinnerP = document.createElement('p');
          const currentWinner = day.nearestToPinWinner; // 'A' | 'B' | null
          if (!currentWinner) {
            currentWinnerP.innerText = 'No winner selected yet.';
          } else {
            currentWinnerP.innerText = `Current Winner: ${
              currentWinner === 'A' ? (teams[0]?.name || 'Team A') : (teams[1]?.name || 'Team B')
            }`;
          }
          ntpDiv.appendChild(currentWinnerP);

          dayView.appendChild(ntpDiv);
        }

        // Summary of incomplete matches
        const summaryDiv = document.createElement('div'); 
        const summary = computeDayUpDownSquare(day.dayNumber);

        if (summary.totalIncomplete > 0) {
          const lineA = document.createElement('p');
          lineA.innerText = `${teams[0]?.name || 'Team A'} is up in ${summary.aUp}, down in ${summary.bUp}, all square in ${summary.allSquare}.`;
          summaryDiv.appendChild(lineA);

          const lineB = document.createElement('p');
          lineB.innerText = `${teams[1]?.name || 'Team B'} is up in ${summary.bUp}, down in ${summary.aUp}, all square in ${summary.allSquare}.`;
          summaryDiv.appendChild(lineB);
        } else {
          summaryDiv.innerText = 'All matches concluded for this day.';
        }

        dayView.appendChild(summaryDiv);

        // Matches for this day
        const dayMatches = matches
          .map((m, idx) => ({ ...m, idx }))
          .filter((m) => m.dayNumber === day.dayNumber);

        if (dayMatches.length === 0) {
          const noMatchesP = document.createElement('p');
          noMatchesP.innerText = 'No matches defined.';
          dayView.appendChild(noMatchesP);
        } else {
          dayMatches.forEach((matchObj) => {
            const matchContainer = document.createElement('div');
            matchContainer.classList.add('match-container');

            // Mark completed matches with color classes
            if (matchObj.winner === 'A') {
              matchContainer.classList.add('a-winner');
            } else if (matchObj.winner === 'B') {
              matchContainer.classList.add('b-winner');
            } else if (matchObj.winner === 'draw') {
              matchContainer.classList.add('draw-winner');
            }

            // Match Title
            const matchTitle = document.createElement('h3');
            const playerALabel = Array.isArray(matchObj.playerA)
              ? matchObj.playerA.join(', ')
              : matchObj.playerA;
            const playerBLabel = Array.isArray(matchObj.playerB)
              ? matchObj.playerB.join(', ')
              : matchObj.playerB;
            matchTitle.innerText = `${playerALabel} vs. ${playerBLabel}`;
            matchContainer.appendChild(matchTitle);

            // Status
            const statusP = document.createElement('p');
            if (matchObj.winner) {
              if (matchObj.winner === 'A') {
                statusP.innerText = `Match finished. Winner: ${playerALabel}`;
              } else if (matchObj.winner === 'B') {
                statusP.innerText = `Match finished. Winner: ${playerBLabel}`;
              } else {
                statusP.innerText = `Match finished. Halved.`;
              }
            } else {
              const up = matchObj.holesUp;
              const holesPlayed = matchObj.holesPlayed;
              const holesRemaining = 18 - holesPlayed;
              if (up > 0) {
                statusP.innerText =
                  `${playerALabel} is ${up} up with ${holesRemaining} to play.`;
              } else if (up < 0) {
                statusP.innerText =
                  `${playerBLabel} is ${Math.abs(up)} up with ${holesRemaining} to play.`;
              } else {
                statusP.innerText = `All square, ${holesRemaining} to play.`;
              }
            }
            matchContainer.appendChild(statusP);

            // Hole container (hole number + row of A/H/B)
            const holeDiv = document.createElement('div');
            holeDiv.classList.add('current-hole');

            const currentHoleIndex = matchHoleIndices[matchObj.idx];
            const holeResult = matchObj.holes[currentHoleIndex];

            // Hole number label
            const holeLabel = document.createElement('p');
            holeLabel.innerText = `Hole ${currentHoleIndex + 1}`;
            holeDiv.appendChild(holeLabel);

            // A/H/B row
            const buttonsDiv = document.createElement('div');
            buttonsDiv.classList.add('current-hole-buttons');

            // A
            const btnA = document.createElement('button');
            btnA.innerText = 'A';
            if (holeResult === 'A') btnA.classList.add('selected');
            btnA.onclick = () => {
              socket.emit('holeUpdate', { matchIndex: matchObj.idx, holeIndex: currentHoleIndex, result: 'A' });
            };
            buttonsDiv.appendChild(btnA);

            // H
            const btnH = document.createElement('button');
            btnH.innerText = 'H';
            if (holeResult === 'H') btnH.classList.add('selected');
            btnH.onclick = () => {
              socket.emit('holeUpdate', { matchIndex: matchObj.idx, holeIndex: currentHoleIndex, result: 'H' });
            };
            buttonsDiv.appendChild(btnH);

            // B
            const btnB = document.createElement('button');
            btnB.innerText = 'B';
            if (holeResult === 'B') btnB.classList.add('selected');
            btnB.onclick = () => {
              socket.emit('holeUpdate', { matchIndex: matchObj.idx, holeIndex: currentHoleIndex, result: 'B' });
            };
            buttonsDiv.appendChild(btnB);

            holeDiv.appendChild(buttonsDiv);
            matchContainer.appendChild(holeDiv);

            // Navigation row for previous/next hole
            const navDiv = document.createElement('div');
            navDiv.classList.add('hole-nav');

            const prevBtn = document.createElement('button');
            prevBtn.innerText = '← Prev Hole';
            prevBtn.disabled = (currentHoleIndex === 0);
            prevBtn.onclick = () => {
              const newIndex = Math.max(0, currentHoleIndex - 1);
              setCurrentHoleIndex(matchObj.idx, newIndex);
            };
            navDiv.appendChild(prevBtn);

            const nextBtn = document.createElement('button');
            nextBtn.innerText = 'Next Hole →';
            nextBtn.disabled = (currentHoleIndex === 17);
            nextBtn.onclick = () => {
              const newIndex = Math.min(17, currentHoleIndex + 1);
              setCurrentHoleIndex(matchObj.idx, newIndex);
            };
            navDiv.appendChild(nextBtn);

            matchContainer.appendChild(navDiv);

            dayView.appendChild(matchContainer);
          });
        }

        container.appendChild(dayView);
      });
    }
  </script>
</body>
</html>
