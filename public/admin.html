<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&family=Open+Sans:wght@300;400;600;700;800&display=swap">
  <title>Ryder Cup Setup</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- .page-wrapper + .admin-container for spacing and layout -->
  <div class="page-wrapper admin-container">
    <h1>Ryder Cup Setup</h1>

    <!-- Cup Name -->
    <div class="row">
      <label for="cupName">Competition/Cup Name:</label>
      <input type="text" id="cupName" placeholder="Enter custom cup name" />
    </div>

    <!-- Teams -->
    <h2>Teams</h2>
    <div class="teams-wrapper">
      <div class="team-block">
        <h3>Team 1</h3>
        <label for="team1Name">Name:</label>
        <input type="text" id="team1Name" value="Team 1" />

        <label for="team1Players">Players (comma-separated):</label>
        <textarea id="team1Players">Alice, Bob</textarea>
      </div>

      <div class="team-block">
        <h3>Team 2</h3>
        <label for="team2Name">Name:</label>
        <input type="text" id="team2Name" value="Team 2" />

        <label for="team2Players">Players (comma-separated):</label>
        <textarea id="team2Players">Charlie, Dave</textarea>
      </div>
    </div>

    <hr />

    <!-- Days & Matches -->
    <h2>Days & Matches</h2>
    <div class="row">
      <label for="numDays">Number of Days:</label>
      <input type="number" id="numDays" value="1" min="1" />
      <button id="generateDaysBtn" type="button">Generate Day Forms</button>
    </div>

    <form id="setupForm">
      <div id="daysContainer"></div>
      <button class="save-setup" type="submit">Save Setup</button>
    </form>

    <button id="resetButton" type="button" style="background-color: #c00; margin-top: 20px;">
        Reset All Data
      </button>
  
      <div id="resetResult"></div>

    <div id="setupResult"></div>
  </div>

  <script>
    const daysContainer = document.getElementById('daysContainer');
    const generateDaysBtn = document.getElementById('generateDaysBtn');
    const setupForm = document.getElementById('setupForm');
    const setupResult = document.getElementById('setupResult');

    generateDaysBtn.addEventListener('click', () => {
      daysContainer.innerHTML = '';
      const numDays = parseInt(document.getElementById('numDays').value, 10);

      for (let i = 1; i <= numDays; i++) {
        const dayDiv = document.createElement('div');
        dayDiv.classList.add('day-block');

        const dayHeader = document.createElement('h3');
        dayHeader.innerText = `Day ${i}`;
        dayDiv.appendChild(dayHeader);

        // Format
        const formatLabel = document.createElement('label');
        formatLabel.innerText = 'Format:';
        const formatInput = document.createElement('input');
        formatInput.type = 'text';
        formatInput.id = `dayFormat-${i}`;
        formatInput.placeholder = 'e.g. Better Ball, Singles, etc.';
        formatLabel.appendChild(formatInput);
        dayDiv.appendChild(formatLabel);

        // Row for number of matches
        const matchRow = document.createElement('div');
        matchRow.classList.add('row');

        const matchNumLabel = document.createElement('label');
        matchNumLabel.innerText = 'Number of Matches:';
        const matchNumInput = document.createElement('input');
        matchNumInput.type = 'number';
        matchNumInput.min = '1';
        matchNumInput.value = '1';
        matchNumInput.id = `dayMatchNum-${i}`;
        matchNumLabel.appendChild(matchNumInput);
        matchRow.appendChild(matchNumLabel);

        const genMatchesBtn = document.createElement('button');
        genMatchesBtn.type = 'button';
        genMatchesBtn.innerText = 'Generate Matches';
        genMatchesBtn.onclick = () => generateMatchesForm(i);
        matchRow.appendChild(genMatchesBtn);

        dayDiv.appendChild(matchRow);

        // Container for matches
        const matchesContainer = document.createElement('div');
        matchesContainer.id = `matchesContainerDay-${i}`;
        dayDiv.appendChild(matchesContainer);

        daysContainer.appendChild(dayDiv);
      }
    });

    function generateMatchesForm(dayNumber) {
      const matchesContainer = document.getElementById(`matchesContainerDay-${dayNumber}`);
      matchesContainer.innerHTML = '';

      const numMatches = parseInt(document.getElementById(`dayMatchNum-${dayNumber}`).value, 10);

      for (let m = 1; m <= numMatches; m++) {
        const matchDiv = document.createElement('div');
        matchDiv.classList.add('match-block');

        const matchHeader = document.createElement('h4');
        matchHeader.innerText = `Match ${m}`;
        matchDiv.appendChild(matchHeader);

        // Team A
        const teamALabel = document.createElement('label');
        teamALabel.innerText = 'Team A (comma-separated): ';
        const teamAInput = document.createElement('input');
        teamAInput.type = 'text';
        teamAInput.id = `day${dayNumber}-match${m}-A`;
        teamALabel.appendChild(teamAInput);
        matchDiv.appendChild(teamALabel);

        // Team B
        const teamBLabel = document.createElement('label');
        teamBLabel.innerText = 'Team B (comma-separated): ';
        const teamBInput = document.createElement('input');
        teamBInput.type = 'text';
        teamBInput.id = `day${dayNumber}-match${m}-B`;
        teamBLabel.appendChild(teamBInput);
        matchDiv.appendChild(teamBLabel);

        matchesContainer.appendChild(matchDiv);
      }
    }

    setupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const cupNameValue = document.getElementById('cupName').value.trim();
      const cupName = cupNameValue !== '' ? cupNameValue : 'My Ryder Cup';

      const team1Name = document.getElementById('team1Name').value.trim() || 'Team 1';
      const team2Name = document.getElementById('team2Name').value.trim() || 'Team 2';
      const team1Players = document.getElementById('team1Players').value
        .split(',')
        .map((p) => p.trim())
        .filter(Boolean);
      const team2Players = document.getElementById('team2Players').value
        .split(',')
        .map((p) => p.trim())
        .filter(Boolean);

      const numDays = parseInt(document.getElementById('numDays').value, 10);
      const daysData = [];
      for (let i = 1; i <= numDays; i++) {
        const formatVal = document.getElementById(`dayFormat-${i}`).value || 'Unknown Format';
        const matchNum = parseInt(document.getElementById(`dayMatchNum-${i}`).value, 10);

        const matchesArr = [];
        for (let m = 1; m <= matchNum; m++) {
          const aVal = document.getElementById(`day${i}-match${m}-A`).value;
          const bVal = document.getElementById(`day${i}-match${m}-B`).value;

          const playerA = aVal.includes(',') ? aVal.split(',').map(x => x.trim()) : aVal.trim();
          const playerB = bVal.includes(',') ? bVal.split(',').map(x => x.trim()) : bVal.trim();

          matchesArr.push({ playerA, playerB });
        }
        daysData.push({
          dayNumber: i,
          format: formatVal,
          matches: matchesArr
        });
      }

      const data = {
        cupName,
        teams: [
          { name: team1Name, players: team1Players },
          { name: team2Name, players: team2Players }
        ],
        days: daysData
      };

      try {
        const resp = await fetch('/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await resp.json();
        setupResult.innerText = 
          `Setup saved! Total Points: ${result.totalPoints}, Points Needed: ${result.pointsNeededToWin}`;
      } catch (err) {
        console.error(err);
        setupResult.innerText = 'Error saving setup.';
      }
    });

        // The "Reset All Data" button
        const resetButton = document.getElementById('resetButton');
    const resetResult = document.getElementById('resetResult');

    resetButton.addEventListener('click', async () => {
      if (!confirm('Are you sure you want to reset ALL data? This cannot be undone.')) {
        return; // user canceled
      }

      try {
        const resp = await fetch('/api/reset', {
          method: 'POST'
        });
        const result = await resp.json();
        if (result.success) {
          resetResult.innerText = 'All data has been reset.';
        } else {
          resetResult.innerText = 'There was an error resetting data.';
        }
      } catch (err) {
        console.error(err);
        resetResult.innerText = 'Error communicating with server.';
      }
    });
  </script>
</body>
</html>
